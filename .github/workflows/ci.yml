# Build headscale FROM SOURCE and, on a version tag, release it with our own
# checksums, SBOM, keyless cosign signature and build provenance. This repo is a
# mirror: it holds no headscale source of its own, it vendors the pinned upstream
# tag (scripts/vendor-headscale.sh) and compiles it. We attest OUR build, never
# re-sign an opaque upstream binary. The three proofs this produces
# (checksums.txt, its .sigstore.json cosign signature, GitHub provenance) are
# exactly what the tui-tools pkgs provenance gate reads.
name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: vendor and build headscale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: vendor the pinned headscale source
        run: scripts/vendor-headscale.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/go.mod
          check-latest: true
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=sign,sbom,publish
      # Informational only: govulncheck runs against UPSTREAM headscale's source,
      # whose findings we do not control. A finding must not make the mirror
      # unbuildable, so this never gates the build; it is recorded for the record.
      - name: govulncheck (informational)
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          (cd src && "$(go env GOPATH)/bin/govulncheck" ./... || true)

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      # contents to attach artifacts, id-token for the keyless cosign identity,
      # attestations to record the provenance gh attestation verify reads.
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: the tag must match the pinned VERSION
        run: |
          pinned="$(tr -d '[:space:]' < VERSION)"
          if [ "$pinned" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION ($pinned)" >&2
            exit 1
          fi
      - name: vendor the pinned headscale source
        run: scripts/vendor-headscale.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/go.mod
          check-latest: true
      # syft for the sboms section, cosign for the signs section: both are called
      # by GoReleaser and have to be on PATH before it runs.
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/checksums.txt
      - name: attach the provenance bundle to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" dist/provenance.intoto.jsonl
          gh release upload "$GITHUB_REF_NAME" dist/provenance.intoto.jsonl --clobber
