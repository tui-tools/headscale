# Build headscale FROM SOURCE and, on a version tag, release it with our own
# checksums, SBOM, keyless cosign signature and build provenance. This repo is a
# mirror: it holds no headscale source of its own, it vendors the pinned upstream
# tag (scripts/vendor-headscale.sh) and compiles it. We attest OUR build, never
# re-sign an opaque upstream binary. The three proofs this produces
# (checksums.txt, its .sigstore.json cosign signature, GitHub provenance) are
# exactly what the tui-tools pkgs provenance gate reads.
name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: vendor and build headscale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # companion.json is what the family website publishes about this mirror,
      # so the version it states has to be the version we actually vendor.
      - name: companion.json must state the pinned VERSION
        run: |
          pinned="$(tr -d '[:space:]' < VERSION)"
          stated="$(jq -r .upstreamVersion companion.json)"
          if [ "$pinned" != "$stated" ]; then
            echo "companion.json says $stated, VERSION says $pinned" >&2
            exit 1
          fi
      # The vendor step is what refuses a moved upstream tag, so its own
      # behaviour is tested against a local throwaway repository first.
      - name: the vendor pin refuses a moved tag
        run: scripts/test-vendor.sh
      - name: vendor the pinned headscale source
        run: scripts/vendor-headscale.sh
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # The current stable Go, NOT the tag's go.mod: stdlib CVEs are fixed
          # by the toolchain, and the vendored tag pins an older one. The
          # binary we attest must carry the patched stdlib.
          go-version: stable
          check-latest: true
      - name: harden the dependency floor
        run: scripts/harden-deps.sh
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=sign,sbom,publish
      # headscale reports whatever Go's VCS stamp says, so a build from a
      # modified tree ships as `+dirty`. Fail here rather than find out from a
      # user's `headscale version`.
      - name: the binaries report the pinned tag, clean
        run: scripts/check-version-stamp.sh
      # Informational only: govulncheck runs against UPSTREAM headscale's source,
      # whose findings we do not control. A finding must not make the mirror
      # unbuildable, so this never gates the build; it is recorded for the record.
      # Pinned like everything else the job runs: @latest would make the
      # result depend on the day. Bump it when golang/vuln cuts a release.
      # It reads the binary we built, in binary mode: that is exactly what
      # ships, module list and symbols included. Source mode cannot take the
      # hardened go.mod through GOFLAGS=-modfile (govulncheck v1.7.0 stops
      # with "-modfile only valid when using modules"), and that error used
      # to be swallowed, so no result was recorded at all. Exit 3 means
      # findings, which stay informational; any other failure is the scan not
      # running, and is shown as a failed step.
      - name: govulncheck (informational)
        continue-on-error: true
        env:
          GOVULNCHECK_VERSION: "v1.7.0"
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          rc=0
          "$(go env GOPATH)/bin/govulncheck" -mode=binary dist/headscale_linux_amd64_v1/headscale || rc=$?
          [ "$rc" -eq 0 ] || [ "$rc" -eq 3 ]

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      # contents to attach artifacts, id-token for the keyless cosign identity,
      # attestations to record the provenance gh attestation verify reads.
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: the tag must match the pinned VERSION
        run: |
          pinned="$(tr -d '[:space:]' < VERSION)"
          if [ "$pinned" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION ($pinned)" >&2
            exit 1
          fi
      - name: vendor the pinned headscale source
        run: scripts/vendor-headscale.sh
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # The current stable Go, NOT the tag's go.mod: stdlib CVEs are fixed
          # by the toolchain, and the vendored tag pins an older one. The
          # binary we attest must carry the patched stdlib.
          go-version: stable
          check-latest: true
      - name: harden the dependency floor
        run: scripts/harden-deps.sh
      # syft for the sboms section, cosign for the signs section: both are called
      # by GoReleaser and have to be on PATH before it runs.
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: the binaries report the pinned tag, clean
        run: scripts/check-version-stamp.sh
      - name: attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/checksums.txt
      - name: attach the provenance bundle to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" dist/provenance.intoto.jsonl
          gh release upload "$GITHUB_REF_NAME" dist/provenance.intoto.jsonl --clobber
